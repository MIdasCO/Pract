services:

  backend:
    build: .
    container_name: fast_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:1234@db:5432/my_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app